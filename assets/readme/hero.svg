<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Kindroid.Library</title>
  <desc id="desc">Kindroid.Library, an unofficial .NET client for the Kindroid AI API. A panel shows a streamed reply arriving as small text chunks, the first being a single space that is kept verbatim.</desc>

  <rect width="1200" height="400" rx="26" fill="#16141D"/>

  <g id="title-block" transform="translate(56 0)">
    <text x="0" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="2" fill="#FFB07A">.NET CLIENT  /  KINDROID API</text>
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="68" font-weight="800" fill="#F3EEF8">Kindroid.Library</text>
    <text x="0" y="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" fill="#CFC8DD">Chat with your Kindroid AIs from .NET:</text>
    <text x="0" y="286" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" fill="#CFC8DD">send, stream, group turns, history.</text>
    <text x="0" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8F88A3">v2.0  /  net10.0  /  MIT  /  unofficial</text>
  </g>

  <g id="stream-proof" transform="translate(680 48)">
    <rect width="464" height="304" rx="22" fill="#1F1B2B" stroke="#2E2940" stroke-width="2"/>
    <text x="24" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8F88A3">SendMessageStreamAsync(…)</text>

    <!-- row 1: the first chunk is a lone space -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="24" text-anchor="middle">
      <rect x="24" y="76" width="64" height="52" rx="12" fill="#FFB07A"/>
      <text x="56" y="111" fill="#16141D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">␣</text>
      <rect x="100" y="76" width="64" height="52" rx="12" fill="#9B8CFF" fill-opacity="0.22" stroke="#9B8CFF" stroke-width="2"/>
      <text x="132" y="111" fill="#F3EEF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">(*</text>
      <rect x="176" y="76" width="64" height="52" rx="12" fill="#9B8CFF" fill-opacity="0.22" stroke="#9B8CFF" stroke-width="2"/>
      <text x="208" y="111" fill="#F3EEF8">萧</text>
      <rect x="252" y="76" width="64" height="52" rx="12" fill="#9B8CFF" fill-opacity="0.22" stroke="#9B8CFF" stroke-width="2"/>
      <text x="284" y="111" fill="#F3EEF8">衍</text>
      <rect x="328" y="76" width="96" height="52" rx="12" fill="#9B8CFF" fill-opacity="0.22" stroke="#9B8CFF" stroke-width="2"/>
      <text x="376" y="111" fill="#F3EEF8">看着</text>

      <!-- row 2 -->
      <rect x="24" y="144" width="96" height="52" rx="12" fill="#9B8CFF" fill-opacity="0.22" stroke="#9B8CFF" stroke-width="2"/>
      <text x="72" y="179" fill="#F3EEF8">眼前</text>
      <rect x="132" y="144" width="128" height="52" rx="12" fill="#9B8CFF" fill-opacity="0.22" stroke="#9B8CFF" stroke-width="2"/>
      <text x="196" y="179" fill="#F3EEF8">的人，</text>
      <rect x="272" y="144" width="64" height="52" rx="12" fill="#9B8CFF" fill-opacity="0.22" stroke="#9B8CFF" stroke-width="2"/>
      <text x="304" y="179" fill="#F3EEF8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">*)</text>
      <rect x="348" y="144" width="76" height="52" rx="12" fill="none" stroke="#8F88A3" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="386" y="179" fill="#8F88A3">…</text>
    </g>

    <text x="24" y="246" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" font-weight="600" fill="#FFB07A">The first chunk is a lone space.</text>
    <text x="24" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#CFC8DD">Every chunk is kept verbatim.</text>
  </g>
</svg>
